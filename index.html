<!doctype html>
<html lang="ja">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>かさねる｜アイコンフレーム</title
  ><link rel="stylesheet" href="styles.css" />
  <header>
    <strong>◉ かさねる</strong><small>登録不要・ブラウザ内で完結</small>
  </header>
  <main>
    <small>ICON FRAME STUDIO</small>
    <h1>お気に入りに、フレームを。</h1>
    <p>
      アイコンと透過PNGを選んで、ぴったりの一枚に。<br />画像は外部へ送信されません。
    </p>
    <div class="layout">
      <section class="panel">
        <strong>01　画像を選ぶ</strong
        ><label class="upload"
          >アイコン画像<input
            id="avatar"
            type="file"
            accept="image/png,image/jpeg,image/webp" /></label
        ><label class="upload"
          >フレーム画像（透過PNG）<input
            id="frame"
            type="file"
            accept="image/png" /></label
        ><strong>02　位置とサイズを調整</strong>
        <p><small>プレビューを指やマウスでドラッグ</small></p>
        <label for="zoom">拡大・縮小 <output id="percent">100%</output></label
        ><input id="zoom" type="range" min="10" max="400" value="100" /><button
          id="reset"
        >
          位置とサイズを戻す
        </button>
        <p>
          <label for="size">保存サイズ </label
          ><select id="size">
            <option value="1024">1024 × 1024</option>
            <option value="512">512 × 512</option>
          </select>
        </p>
        <button id="save" class="primary" disabled>PNGで保存 ↓</button>
        <p id="status" role="status">まずは画像を選んでください</p>
      </section>
      <section class="preview">
        <strong>プレビュー</strong>
        <div class="board">
          <canvas
            id="canvas"
            width="1024"
            height="1024"
            aria-label="合成画像。ドラッグでアイコンの位置を調整"
          ></canvas>
        </div>
        <small>チェック柄の部分は透明で保存されます</small>
        <p><button id="demo">サンプルで試す</button></p>
      </section>
    </div>
  </main>
  <footer>あなたの画像は、あなたの端末の中だけに。</footer>
  <script src="app.js"></script>
</html>
